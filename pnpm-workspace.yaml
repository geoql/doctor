packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  better-sqlite3: true
  sharp: true
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - vue-eslint-parser
  - '@nuxt/*'
  - miniflare
  - nuxt
  - reka-ui
  - wrangler
  - '@lucide/*'
