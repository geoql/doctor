packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  better-sqlite3: true
  sharp: true
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - vue-eslint-parser
  - '@nuxt/*'
  - miniflare
  - nuxt
  - reka-ui
  - wrangler
  - '@lucide/*'
  - '@cloudflare/*'
  - workerd
  - '@oxc-parser/*'
  - '@oxc-project/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - oxc-parser
  - oxfmt
  - oxlint

overrides:
  # unhead >=3.2.1 fixes nuxt#35670 (streaming IIFE corruption in the unhead
  # v3 line Nuxt 4.5 adopts); same override as the-doctor.report / talon.
  unhead: ^3.2.1
  '@unhead/vue': ^3.2.1
