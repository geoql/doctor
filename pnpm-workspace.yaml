packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  better-sqlite3: true
  sharp: true
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - vue-eslint-parser
  - '@nuxt/*'
  - miniflare
  - nuxt
  - reka-ui
  - wrangler
  - '@lucide/*'
  - '@cloudflare/*'
  - workerd
  - '@oxc-parser/*'
  - '@oxc-project/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - oxc-parser
  - oxfmt
  - oxlint
  - shadscan-vue
  - eslint-plugin-oxlint
  - '@types/*'

overrides:
  # unhead >=3.2.1 fixes nuxt#35670 (streaming IIFE corruption in the unhead
  # v3 line Nuxt 4.5 adopts); same override as the-doctor.report / talon.
  unhead: ^3.4.3
  '@unhead/vue': ^3.4.3
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  '@vitest/coverage-v8': 5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
