name: 'Nuxt Doctor'
description: 'Audit a Nuxt project with @geoql/nuxt-doctor and surface the score, findings, and a SARIF report.'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  preset:
    description: 'Base rule preset: minimal | recommended | strict | all.'
    required: false
    default: 'recommended'
  threshold:
    description: 'Minimum passing score (0-100). The job fails when the score is below this value.'
    required: false
    default: '0'
  fail-on:
    description: 'Exit non-zero on this severity or worse: error | warn | none.'
    required: false
    default: 'error'
  diff:
    description: "Only report findings in files changed vs HEAD. Set to 'true' to enable."
    required: false
    default: 'false'
  pr-comment:
    description: "Emit a Markdown PR comment. Set to 'true' to enable."
    required: false
    default: 'false'
  working-directory:
    description: 'Directory to run the audit in (the Nuxt project root).'
    required: false
    default: '.'

outputs:
  score:
    description: 'The integer quality score (0-100) reported by nuxt-doctor.'
    value: ${{ steps.doctor.outputs.score }}
  findings-count:
    description: 'The total number of diagnostics reported by nuxt-doctor.'
    value: ${{ steps.doctor.outputs.findings-count }}

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install nuxt-doctor
      shell: bash
      run: pnpm add -g @geoql/nuxt-doctor

    - name: Run nuxt-doctor
      id: doctor
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        args=(--preset "$INPUT_PRESET" --threshold "$INPUT_THRESHOLD" --fail-on "$INPUT_FAIL_ON")
        if [ "$INPUT_DIFF" = "true" ]; then
          args+=(--diff)
        fi

        # Run the audit once to JSON (drives outputs + the gate exit code), then
        # emit SARIF from the same args for Code Scanning. set +e lets us capture
        # the gate exit code instead of letting `set -e` abort the step.
        set +e
        nuxt-doctor "${args[@]}" --format json --output doctor-report.json
        code=$?
        nuxt-doctor "${args[@]}" --format sarif --output doctor.sarif
        set -e

        score=$(jq -r '.score.value' doctor-report.json)
        findings=$(jq -r '.diagnostics | length' doctor-report.json)

        {
          echo "score=$score"
          echo "findings-count=$findings"
        } >> "$GITHUB_OUTPUT"

        if [ "$code" -ne 0 ]; then
          exit "$code"
        fi

    - name: Generate PR comment
      if: inputs.pr-comment == 'true'
      shell: bash
      run: |
        set +e
        nuxt-doctor --preset "$INPUT_PRESET" --threshold "$INPUT_THRESHOLD" --fail-on "$INPUT_FAIL_ON" --pr-comment --output doctor-comment.md
        set -e

    - name: Post PR comment
      if: inputs.pr-comment == 'true'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: doctor
        path: doctor-comment.md
