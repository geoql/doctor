name: Lint Branch Name

on:
  workflow_call:

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          branch="$BRANCH"
          pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$"

          # release-please branches: `release-please--branches--main--...`
          # dependabot branches: `dependabot/<ecosystem>/...`
          # changeset-release branches: `changeset-release/main`
          # These don't match the kebab-case regex below, so allowlist them.
          if [[ "$branch" =~ ^release-please-- ]] || [[ "$branch" =~ ^dependabot/ ]] || [[ "$branch" =~ ^changeset-release/ ]]; then
            echo "✅ Automated branch '$branch' — skipping validation."
            exit 0
          fi

          if [[ ! "$branch" =~ $pattern ]]; then
            echo "❌ Invalid branch name: '$branch'"
            echo ""
            echo "Branch names must follow the pattern:"
            echo "  <type>/<kebab-case-description>"
            echo ""
            echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo ""
            echo "Rules:"
            echo "  - Lowercase only"
            echo "  - Words separated by hyphens"
            echo "  - No 'origin/' prefix"
            echo "  - No slashes in the description"
            echo ""
            echo "Examples:"
            echo "  ✅  chore/format-and-lint"
            echo "  ✅  feat/add-no-v-html-rule"
            echo "  ✅  fix/sfc-loc-offset"
            echo "  ❌  origin/chore/formatandlint  (has 'origin/' prefix)"
            echo "  ❌  feature/AddRule             (unknown type, camelCase)"
            echo "  ❌  chore/format_and_lint        (underscores not allowed)"
            exit 1
          fi

          echo "✅ Branch name '$branch' is valid."
