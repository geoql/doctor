name: Deploy Docs

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The docs site codegens one Markdown page per rule out of
      # @geoql/doctor-core's RULE_REGISTRY (`apps/docs/scripts/generate-rule-pages.ts`).
      # That script imports the package's `dist/`, so the workspace
      # package must be built first.
      - name: Build @geoql/doctor-core
        run: pnpm --filter @geoql/doctor-core build

      - name: Build
        run: pnpm --filter @geoql/doctor-docs build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NITRO_PRESET: cloudflare_module
          NUXT_TELEMETRY_DISABLED: 1

      # nitro writes the merged wrangler config to .output/server/wrangler.json
      # via deployConfig (see nuxt.config.ts) — point --config at it.
      - name: Deploy to Cloudflare Workers
        working-directory: apps/docs
        run: pnpm exec wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
