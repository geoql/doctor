coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

comment:
  layout: 'reach, diff, flags, files'
  require_changes: false

ignore:
  - 'packages/*/dist'
  - 'packages/*/tests'
  - '**/*.d.ts'
